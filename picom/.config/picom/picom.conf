# ==========================================
# Бэкенд и производительность
# ==========================================
# Для форка pijulius и карт NVIDIA обязателен glx
backend = "glx";

# Полностью отключаем вертикальную синхронизацию, как ты и просил
vsync = false;

# КРИТИЧЕСКИ ВАЖНО ДЛЯ CS2: 
# Эта настройка заставляет picom отдавать прямой доступ к экрану
# полноэкранным приложениям. Композитор "засыпает", пока ты в игре.
unredir-if-possible = true;

# Оптимизации для стабильной работы с драйверами NVIDIA
#glx-no-stencil = true;
#glx-no-rebind-pixmap = true;
use-damage = true;

# ==========================================
# Исключения (На случай, если unredir сработает не сразу)
# ==========================================
# Убираем любые эффекты композитора с окон CS2
shadow-exclude = [
  "class_g = 'gameoverlayui'",
  "class_g = 'Steam'",
  "class_g = 'cs2'",
  "class_g = 'csgo'"
];
fade-exclude = [
  "class_g = 'gameoverlayui'",
  "class_g = 'Steam'",
  "class_g = 'cs2'",
  "class_g = 'csgo'"
];
focus-exclude = [
  "class_g = 'cs2'",
  "class_g = 'csgo'"
];

unredir-if-possible-exclude = [
  "class_g = 'gameoverlayui'",
  "class_g = 'Steam'",
  "class_g = 'Sober'",
  "class_g = 'sober'",
  "class_g = 'org.vinegarhq.Sober'"
];

# ==========================================
# Анимации (Специфика форка picom-pijulius)
# ==========================================
animations = true;
# Настройки физики анимаций (можешь покрутить под свой вкус)
animation-stiffness = 200.0;
animation-window-mass = 1.0;
animation-dampening = 20.0;
animation-clamping = true;

# Типы анимаций при разных действиях (zoom, fly-in, slide-up и т.д.)
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "zoom";

# ==========================================
# Базовые визуальные настройки
# ==========================================
shadow = false; # Тени жрут ресурсы, лучше держать выключенными, если не нужны
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;
