# ==============================================================================
# Modern Kitty Terminal Configuration
# ==============================================================================

# --- Typography ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Appearance & Layout ---
window_padding_width 10
confirm_os_window_close 0
remember_window_size  no
initial_window_width  950
initial_window_height 560
placement_strategy    center
hide_window_decorations no
background_opacity    0.95
dynamic_background_opacity yes

# --- Cursor Customization ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval -1
cursor_stop_blinking_after 15.0

# --- Bell & Audio ---
enable_audio_bell     no
visual_bell_duration  0.0

# --- Scrollback & History ---
scrollback_lines      10000
wheel_scroll_multiplier 3.0

# --- Mouse & Hyperlinks ---
url_style             curly
open_url_with         default
detect_urls           yes
underline_hyperlinks  hover
copy_on_select        no

# --- Tab Bar ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{title}{' [Z]' if layout_name == 'stack' else ''}"

# --- Advanced & IPC ---
allow_remote_control  yes
listen_on             unix:@kitty

# --- Default Fallback Colors (TokyoNight Dark) ---
# Used before wal generates colors or on a clean installation
foreground            #c0caf5
background            #1a1b26
selection_foreground  #c0caf5
selection_background  #33467c

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# --- Pywal Dynamic Palette Override ---
# Overrides default colors with current active theme palette
include ~/.cache/wal/colors-kitty.conf
